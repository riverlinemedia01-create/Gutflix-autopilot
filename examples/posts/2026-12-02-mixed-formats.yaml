# Different formats on each platform, plus a staggered time and a group target.
# A file can hold several posts separated by ---

id: 2026-12-02-behind-the-scenes
publish_at: 2026-12-02 12:00
targets:
  - account: gutflix-instagram
    type: carousel
    media: [media/bts-1.jpg, media/bts-2.jpg, media/bts-3.jpg]   # JPEG only for Instagram
    caption: "Behind the scenes from day 1 📸 #gutflix"

  - account: all-x                       # a group: posts to every account in it
    publish_at: 2026-12-02 12:30         # this target goes out 30 minutes later
    text: "A few frames from the set 📸"
    media: [media/bts-1.jpg, media/bts-2.jpg]
---
id: 2026-12-03-text-thread
