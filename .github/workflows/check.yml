name: Check posts

# Runs when you push a change, so a typo or missing file shows up
# right away instead of at posting time.
on:
  push:
    paths: ["posts/**", "config/**", "media/**", "autopost/**", "tests/**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Validate posts and secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python -m autopost validate --check-secrets
      - run: python -m autopost plan
