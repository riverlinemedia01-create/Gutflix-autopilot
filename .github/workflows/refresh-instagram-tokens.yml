name: Refresh Instagram tokens

on:
  schedule:
    - cron: "17 3 * * 1"           # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh and save tokens
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}   # fine-grained token: Secrets read/write on this repo
          GH_REPO: ${{ github.repository }}
        run: python tools/refresh_instagram_tokens.py
